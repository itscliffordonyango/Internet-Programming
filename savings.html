<!-- Question
At Zetech University, a student decides to save money every month to meet personal expenses. The student increases the monthly savings by Ksh 2,000 after every month due to increased income. Write a program that will prompt the user to enter the amount saved in the first month. The program should then compute and display the expected savings amount for the next six consecutive months.
Your solution should demonstrate the use of:
•	For loop
•	While loop
•	Do while loop
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zetech University Savings Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #1bd2e6 100%);
            color: #333;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .input-section {
            text-align: center;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
        }
        input[type="number"] {
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 250px;
            margin-bottom: 15px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        .results-section {
            margin: 20px 0;
        }
        .results-section h3 {
            color: #4CAF50;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f4f4f4;
            font-weight: bold;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .total {
            font-weight: bold;
            font-size: 18px;
            color: #4CAF50;
            text-align: right;
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            input[type="number"] {
                width: 100%;
            }
            table {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <h1>Zetech University Savings Calculator</h1>
    <div class="container">
        <div class="input-section">
            <label for="initialSavings">Enter the amount saved in the first month (Ksh):</label>
            <input type="number" id="initialSavings" min="0" step="0.01" placeholder="e.g., 5000">
            <button onclick="calculateSavings()">Calculate Savings</button>
        </div>
        <div id="results"></div>
    </div>
    <script>
        function calculateSavings() {
            let initialSavings = parseFloat(document.getElementById('initialSavings').value);
            if (isNaN(initialSavings) || initialSavings < 0) {
                alert('Please enter a valid positive amount.');
                return;
            }
            let monthlyIncrease = 2000;
            let resultsDiv = document.getElementById('results');
            
            // Using a for loop to calculate savings for the next six months
            let forTotal = 0;
            let forTable = '<div class="results-section"><h3>Using For Loop</h3><table><tr><th>Month</th><th>Savings (Ksh)</th></tr>';
            for (let month = 1; month <= 6; month++) {
                let savings = initialSavings + (month - 1) * monthlyIncrease;
                forTotal += savings;
                forTable += `<tr><td>Month ${month}</td><td>${savings.toLocaleString()}</td></tr>`;
            }
            forTable += `</table><div class="total">Total Savings: Ksh ${forTotal.toLocaleString()}</div></div>`;
            
            // Using a while loop to calculate savings for the next six months
            let whileTotal = 0;
            let whileTable = '<div class="results-section"><h3>Using While Loop</h3><table><tr><th>Month</th><th>Savings (Ksh)</th></tr>';
            let month = 1;
            while (month <= 6) {
                let savings = initialSavings + (month - 1) * monthlyIncrease;
                whileTotal += savings;
                whileTable += `<tr><td>Month ${month}</td><td>${savings.toLocaleString()}</td></tr>`;
                month++;
            }
            whileTable += `</table><div class="total">Total Savings: Ksh ${whileTotal.toLocaleString()}</div></div>`;
            
            // Using a do-while loop to calculate savings for the next six months
            let doWhileTotal = 0;
            let doWhileTable = '<div class="results-section"><h3>Using Do-While Loop</h3><table><tr><th>Month</th><th>Savings (Ksh)</th></tr>';
            month = 1;
            do {
                let savings = initialSavings + (month - 1) * monthlyIncrease;
                doWhileTotal += savings;
                doWhileTable += `<tr><td>Month ${month}</td><td>${savings.toLocaleString()}</td></tr>`;
                month++;
            } while (month <= 6);
            doWhileTable += `</table><div class="total">Total Savings: Ksh ${doWhileTotal.toLocaleString()}</div></div>`;
            
            resultsDiv.innerHTML = forTable + whileTable + doWhileTable;
        }
    </script>
</body>
</html>
