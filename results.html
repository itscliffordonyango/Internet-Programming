<!-- 
scenario :
Write a programm to process students academic results. The program should prompt the user to enter Students admission number, name, and the average marks otained for  the four academic years. namely first year, second year, third year and fourth year. The program should then compute and display the students overall average marks and the corresponding grade. The grading system is as follows:
Average Marks	Grade
>=70 :First Class 
>=60 and <70 :Second Class Upper
>=50 and <60 :Second Class Lower
>=40 and <50 :Pass
<40 :Not eligible for graduation


-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Academic Results Processor</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: #2d3436;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3436;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #74b9ff;
            box-shadow: 0 0 10px rgba(116, 185, 255, 0.3);
        }
        .buttons {
            text-align: center;
            margin-top: 20px;
        }
        button {
            background: #00b894;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0 10px;
        }
        button:hover {
            background: #00a085;
            transform: translateY(-2px);
        }
        button[type="reset"] {
            background: #e17055;
        }
        button[type="reset"]:hover {
            background: #d63031;
        }
        #results {
            margin-top: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            display: none;
        }
        .student-info {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .yearly-marks {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background: #74b9ff;
            color: white;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background: #f8f9fa;
        }
        .grade {
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin: 20px 0;
        }
        .grade.first-class { background: #00b894; color: white; }
        .grade.second-upper { background: #fdcb6e; color: #2d3436; }
        .grade.second-lower { background: #fd79a8; color: white; }
        .grade.pass { background: #6c5ce7; color: white; }
        .grade.fail { background: #e17055; color: white; }
        .average {
            font-size: 20px;
            font-weight: bold;
            color: #00b894;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            input, button {
                font-size: 16px;
            }
            table {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <h1>Student Academic Results Processor</h1>
    <div class="container">
        <form id="resultsForm">
            <div class="form-group">
                <label for="admissionNumber">Admission Number:</label>
                <input type="text" id="admissionNumber" required>
            </div>
            <div class="form-group">
                <label for="name">Student Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="firstYear">First Year Average Marks (0-100):</label>
                <input type="number" id="firstYear" min="0" max="100" step="0.01">
            </div>
            <div class="form-group">
                <label for="secondYear">Second Year Average Marks (0-100):</label>
                <input type="number" id="secondYear" min="0" max="100" step="0.01">
            </div>
            <div class="form-group">
                <label for="thirdYear">Third Year Average Marks (0-100):</label>
                <input type="number" id="thirdYear" min="0" max="100" step="0.01">
            </div>
            <div class="form-group">
                <label for="fourthYear">Fourth Year Average Marks (0-100):</label>
                <input type="number" id="fourthYear" min="0" max="100" step="0.01">
            </div>
            <div class="buttons">
                <button type="submit">Calculate Results</button>
                <button type="reset">Reset Form</button>
            </div>
        </form>

        <div id="results"></div>
    </div>

    <script>
        document.getElementById('resultsForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Get form values
            const admissionNumber = document.getElementById('admissionNumber').value.trim();
            const name = document.getElementById('name').value.trim();
            const firstYear = parseFloat(document.getElementById('firstYear').value) || 0;
            const secondYear = parseFloat(document.getElementById('secondYear').value) || 0;
            const thirdYear = parseFloat(document.getElementById('thirdYear').value) || 0;
            const fourthYear = parseFloat(document.getElementById('fourthYear').value) || 0;

            // Validation
            if (!admissionNumber || !name) {
                alert('Please enter admission number and name.');
                return;
            }
            if (firstYear < 0 || firstYear > 100 || secondYear < 0 || secondYear > 100 ||
                thirdYear < 0 || thirdYear > 100 || fourthYear < 0 || fourthYear > 100) {
                alert('Marks must be between 0 and 100.');
                return;
            }

            const averageMarks = (firstYear + secondYear + thirdYear + fourthYear) / 4;
            let grade, gradeClass;

            if (averageMarks >= 70) {
                grade = 'First Class';
                gradeClass = 'first-class';
            } else if (averageMarks >= 60) {
                grade = 'Second Class Upper';
                gradeClass = 'second-upper';
            } else if (averageMarks >= 50) {
                grade = 'Second Class Lower';
                gradeClass = 'second-lower';
            } else if (averageMarks >= 40) {
                grade = 'Pass';
                gradeClass = 'pass';
            } else {
                grade = 'Not eligible for graduation';
                gradeClass = 'fail';
            }

            // Display results
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="student-info">
                    <h2>Results for ${name}</h2>
                    <p><strong>Admission Number:</strong> ${admissionNumber}</p>
                    <p class="average"><strong>Overall Average:</strong> ${averageMarks.toFixed(2)}%</p>
                </div>
                
                <h3>Yearly Performance</h3>
                <div class="yearly-marks">
                    <table>
                        <thead>
                            <tr>
                                <th>Year</th>
                                <th>Average Marks</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td>First Year</td><td>${firstYear.toFixed(2)}</td></tr>
                            <tr><td>Second Year</td><td>${secondYear.toFixed(2)}</td></tr>
                            <tr><td>Third Year</td><td>${thirdYear.toFixed(2)}</td></tr>
                            <tr><td>Fourth Year</td><td>${fourthYear.toFixed(2)}</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="grade ${gradeClass}">
                    <strong>Final Grade: ${grade}</strong>
                </div>
            `;
            resultsDiv.style.display = 'block';
            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        });

        // Reset functionality
        document.getElementById('resultsForm').addEventListener('reset', function() {
            document.getElementById('results').style.display = 'none';
        });
    </script>
</body>
</html>
