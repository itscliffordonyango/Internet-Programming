<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
</head>
<body>
    <h2>Student Registration Form</h2>
    <form action="register_student.php" method="POST" enctype="multipart/form-data">
        <label>Student ID:</label><br>
        <input type="text" name="student_id" required><br><br>

        <label>Full Name:</label><br>
        <input type="text" name="student_name" required><br><br>

        <label>Report Date:</label><br>
        <input type="date" name="report_date" required><br><br>

        <label>Profile Picture:</label><br>
        <input type="file" name="profile_picture" accept="image/*" required><br><br>

        <button type="submit" name="submit">Register</button>
    </form>
</body>
</html>
