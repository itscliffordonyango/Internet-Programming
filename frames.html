<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Panel Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: grid;
            grid-template-columns: 30% 40% 30%;
            height: 100vh;
            gap: 0;
        }
        
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <iframe  src="index.html" title="Frame 1"></iframe>
    <iframe src="list.html" title="Frame 2"></iframe>
    <iframe src="Webdev.html" title="Frame 3"></iframe>
</body>
</html>
